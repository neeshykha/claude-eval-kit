[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-kit"
version = "0.1.0"
description = "A small, reusable framework for scoring AI classifiers against ground truth via the Claude Code CLI."
requires-python = ">=3.10"

[tool.setuptools]
packages = ["eval_kit"]
